<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Frame</title></head>
  <body>
    <button type="button" id="b">Frame button</button>
    <p id="o"></p>
    <script>
      document.getElementById('b').addEventListener('click', () => { document.getElementById('o').textContent = 'Frame clicked'; });
    </script>
  </body>
</html>
