name: Sync Wiki

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  sync-wiki:
    name: Sync wiki/ to GitHub Wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Push wiki pages to repository Wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WIKI_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          if ! git ls-remote "${WIKI_URL}" >/dev/null 2>&1; then
            echo "GitHub Wiki repository is not initialized yet; skipping automatic sync."
            exit 0
          fi
          git clone "${WIKI_URL}" /tmp/repo-wiki
          find /tmp/repo-wiki -maxdepth 1 -mindepth 1 ! -name '.git' -exec rm -rf {} +
          cp -R wiki/. /tmp/repo-wiki/
          cd /tmp/repo-wiki
          git config user.name "dcluomax"
          git config user.email "1477354+dcluomax@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
          else
            git commit -m "Sync Wiki from main (${GITHUB_SHA::7})"
            git push origin HEAD
          fi
