name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-host:
    name: Build Host (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            bin: BrowserBridge.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            label: windows-arm64
            bin: BrowserBridge.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            bin: BrowserBridge
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
            bin: BrowserBridge
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            bin: BrowserBridge
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build release host
        working-directory: rust
        run: cargo build --release --target ${{ matrix.target }} -p browser-bridge
      - name: Stage binary archive
        shell: bash
        run: |
          mkdir -p stage dist-host "dist-raw/${{ matrix.label }}"
          cp "rust/target/${{ matrix.target }}/release/${{ matrix.bin }}" stage/
          cp "rust/target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist-raw/${{ matrix.label }}/${{ matrix.bin }}"
          cp README.md CHANGELOG.md LICENSE docs/AGENT.md docs/VERSIONING.md docs/UPGRADE.md docs/DEBUGGING.md docs/INSTALLATION.md stage/
          cp -R routines stage/routines
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            (cd stage && 7z a "../dist-host/browser-bridge-${{ matrix.label }}.zip" .)
          else
            tar -czf "dist-host/browser-bridge-${{ matrix.label }}.tar.gz" -C stage .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: host-${{ matrix.label }}
          path: |
            dist-host/*
            dist-raw/${{ matrix.label }}/*

  build-extensions-and-sdk:
    name: Build Extensions & Python Wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: extension/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package Chromium (.zip) & Firefox (.xpi)
        working-directory: extension
        run: |
          npm ci
          npm run package
      - name: Build Python sdist & wheel
        run: |
          python -m pip install build
          python -m build python --outdir dist-python
      - uses: actions/upload-artifact@v4
        with:
          name: extensions-and-python
          path: |
            extension/dist/artifacts/*
            extension/dist/chromium/**
            extension/dist/firefox/**
            dist-python/*

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-host, build-extensions-and-sdk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Assemble verified distribution packages & flatten release assets
        run: |
          mkdir -p flat-assets
          cp release-assets/dist-host/* flat-assets/
          cp release-assets/extension/dist/artifacts/* flat-assets/
          cp release-assets/dist-python/* flat-assets/
          chmod +x release-assets/dist-raw/linux-x64/BrowserBridge
          for pair in \
            "windows-x64:windows-x86_64:BrowserBridge.exe" \
            "windows-arm64:windows-aarch64:BrowserBridge.exe" \
            "macos-arm64:macos-aarch64:BrowserBridge" \
            "macos-x64:macos-x86_64:BrowserBridge" \
            "linux-x64:linux-x86_64:BrowserBridge"
          do
            IFS=':' read -r label target bin <<< "$pair"
            python3 scripts/distribution.py pack \
              --root . \
              --target "$target" \
              --native-binary "release-assets/dist-raw/$label/$bin" \
              --extension-dir "release-assets/extension/dist" \
              --output flat-assets
          done
          ls -lh flat-assets
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: flat-assets/*
