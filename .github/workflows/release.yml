name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-host:
    name: Build Host (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            bin: BrowserBridge.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            label: windows-arm64
            bin: BrowserBridge.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            bin: BrowserBridge
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
            bin: BrowserBridge
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            bin: BrowserBridge
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          save-if: "false"
      - name: Build release host
        working-directory: rust
        run: cargo build --release --target ${{ matrix.target }} -p browser-bridge
      - name: Stage binary archive
        shell: bash
        run: |
          mkdir -p stage dist-host
          cp "rust/target/${{ matrix.target }}/release/${{ matrix.bin }}" stage/
          cp README.md CHANGELOG.md LICENSE docs/AGENT.md docs/VERSIONING.md docs/UPGRADE.md stage/
          cp -R routines stage/routines
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            (cd stage && 7z a "../dist-host/browser-bridge-${{ matrix.label }}.zip" .)
          else
            tar -czf "dist-host/browser-bridge-${{ matrix.label }}.tar.gz" -C stage .
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: host-${{ matrix.label }}
          path: dist-host/*

  build-extensions-and-sdk:
    name: Build Extensions & Python Wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: extension/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Package Chromium (.zip) & Firefox (.xpi)
        working-directory: extension
        run: |
          npm ci
          npm run package
      - name: Build Python sdist & wheel
        run: |
          python -m pip install build
          python -m build python --outdir dist-python
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extensions-and-python
          path: |
            extension/dist/artifacts/*
            dist-python/*

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-host, build-extensions-and-sdk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: |
            release-assets/*
            release-assets/**/*
