<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350" role="img" aria-labelledby="sm-title sm-desc">
  <title id="sm-title">Adaptive Error-Driven Site Learning, Executable Routines, and WebMCP</title>
  <desc id="sm-desc">Diagram showing how Browser Bridge observes first-visit friction such as stalled onload beacons, SPA hydration delays, overlay blockers, and 403 WAF responses, persists a per-domain SitePlaybook, and executes subsequent visits in milliseconds via learned profiles, multi-step routines, and WebMCP tools.</desc>
  <defs>
    <marker id="sm-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1200" height="350" rx="18" fill="#0f172a"/>
  <rect x="1" y="1" width="1198" height="348" rx="17" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="40" y="44" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="700">Adaptive Site Memory, Fast Routines &amp; Native WebMCP</text>
  <text x="640" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14">Turns slow first-visit detours into instant domain playbooks</text>

  <g transform="translate(36, 72)">
    <rect width="340" height="244" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.3"/>
    <text x="22" y="34" fill="#fde68a" font-family="system-ui, sans-serif" font-size="15.5" font-weight="700">Visit 1 · Real-World Web Friction</text>
    <text x="22" y="66" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• Stalled `window.onload` analytics beacons</text>
    <text x="22" y="94" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• SPA hydration race (`stale_ref` / `not_ready`)</text>
    <text x="22" y="122" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• Covered button (`&lt;div#cookie-wall&gt;`)</text>
    <text x="22" y="150" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• Direct HTTP `403` WAF block on API URL</text>
    <text x="22" y="178" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• Complex canvas app (`app.diagrams.net`)</text>
    <rect x="20" y="196" width="300" height="32" rx="7" fill="#0f172a" stroke="#475569"/>
    <text x="170" y="217" text-anchor="middle" fill="#cbd5e1" font-family="ui-monospace, Consolas, monospace" font-size="11.5">Error -&gt; Recovery -&gt; Retry Success</text>
  </g>

  <path d="M 376 194 L 426 194" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#sm-arrow)"/>

  <g transform="translate(430, 72)">
    <rect width="340" height="244" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.4"/>
    <text x="22" y="34" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="15.5" font-weight="700">SiteLearner · Local Domain Playbook</text>
    <text x="22" y="66" fill="#cbd5e1" font-family="ui-monospace, Consolas, monospace" font-size="12">preferredWaitUntil = "domcontentloaded"</text>
    <text x="22" y="94" fill="#cbd5e1" font-family="ui-monospace, Consolas, monospace" font-size="12">hydrationSettleMs  = 250</text>
    <text x="22" y="122" fill="#cbd5e1" font-family="ui-monospace, Consolas, monospace" font-size="12">learnedRecoveries  = [click #accept]</text>
    <text x="22" y="150" fill="#cbd5e1" font-family="ui-monospace, Consolas, monospace" font-size="12">directHttpBlocked  = true (status 403)</text>
    <text x="22" y="178" fill="#cbd5e1" font-family="ui-monospace, Consolas, monospace" font-size="12">routines = [read_diagram_xml, ...]</text>
    <rect x="20" y="196" width="300" height="32" rx="7" fill="#042f2e" stroke="#14b8a6"/>
    <text x="170" y="217" text-anchor="middle" fill="#99f6e4" font-family="ui-monospace, Consolas, monospace" font-size="11.5">Stored locally in routines/&lt;domain&gt;.json</text>
  </g>

  <path d="M 770 194 L 820 194" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#sm-arrow)"/>

  <g transform="translate(824, 72)">
    <rect width="340" height="244" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1.4"/>
    <text x="22" y="34" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="15.5" font-weight="700">Visit 2+ · Sub-Second Execution</text>
    <text x="22" y="66" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">✓ Skips 4.5s beacon wait automatically</text>
    <text x="22" y="94" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">✓ Surfaces `[Site Memory]` inside snapshot</text>
    <text x="22" y="122" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">✓ 1-call `browser_routine_run` workflows</text>
    <text x="22" y="150" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">✓ `smart_fetch` routes 403 via page session</text>
    <text x="22" y="178" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">✓ Invokes W3C `document.modelContext` tools</text>
    <rect x="20" y="196" width="300" height="32" rx="7" fill="#052e16" stroke="#16a34a"/>
    <text x="170" y="217" text-anchor="middle" fill="#bbf7d0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Zero extra LLM round-trips on repeat tasks</text>
  </g>
</svg>
