    <text x="22" y="178" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12.5">✓ ChatGPT deterministic stop-button wait</text>
    <rect x="20" y="198" width="316" height="32" rx="7" fill="#052e16" stroke="#16a34a"/>
    <text x="178" y="219" text-anchor="middle" fill="#bbf7d0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Zero extra LLM round-trips on repeat tasks</text>
