<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 520" width="1240" height="520" role="img" aria-labelledby="popup-title popup-desc">
  <title id="popup-title">Browser Bridge Extension Popup Interface — Tab Sharing and Security Settings</title>
  <desc id="popup-desc">Side-by-side visual showcase of the Browser Bridge toolbar popup: Main tab sharing view with Read-Only and Read-Write mode selector, Copy Agent Prompt button, and Shared Tabs list on the left; Security and Profile Settings panel on the right.</desc>
  <rect width="1240" height="520" rx="18" fill="#0b1120"/>
  <rect x="1" y="1" width="1238" height="518" rx="17" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="48" y="42" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="700">Toolbar Extension Popup — Granular Tab Control &amp; Security Gates</text>
  <text x="1192" y="42" text-anchor="end" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5">React 19 + Astryx · Dark / Light · EN / 中文 / 日本語</text>

  <g transform="translate(48, 66)">
    <rect width="548" height="422" rx="16" fill="#141821" stroke="#334155" stroke-width="1.5"/>
    <circle cx="28" cy="30" r="6" fill="#22c55e"/>
    <text x="44" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Browser Bridge</text>
    <rect x="174" y="17" width="168" height="26" rx="13" fill="#052e16" stroke="#16a34a"/>
    <text x="258" y="34" text-anchor="middle" fill="#86efac" font-family="ui-monospace, Consolas, monospace" font-size="11.5" font-weight="600">edge · a1b2c3d4e5f6</text>

    <rect x="382" y="16" width="66" height="28" rx="8" fill="#1e293b" stroke="#475569"/>
    <text x="415" y="34" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">EN ▾</text>
    <rect x="456" y="16" width="72" height="28" rx="8" fill="#1e293b" stroke="#475569"/>
    <text x="492" y="34" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Settings</text>

    <rect x="20" y="60" width="508" height="176" rx="12" fill="#1e2433" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="38" y="84" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.6">CURRENT TAB · SHARED WITH AI</text>
    <rect x="434" y="68" width="76" height="24" rx="6" fill="#1d4ed8"/>
    <text x="472" y="84" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, Consolas, monospace" font-size="11" font-weight="700">AI · RW</text>

    <text x="38" y="111" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Fix retry queue race condition · Pull Request #104</text>
    <text x="38" y="131" fill="#94a3b8" font-family="ui-monospace, Consolas, monospace" font-size="12">https://github.com/example-org/service/pull/104</text>

    <rect x="38" y="146" width="224" height="34" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="94" y="167" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600">Read-Only</text>
    <rect x="148" y="149" width="111" height="28" rx="6" fill="#2563eb"/>
    <text x="203" y="167" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Read-Write</text>

    <rect x="274" y="146" width="142" height="34" rx="8" fill="#0f172a" stroke="#38bdf8"/>
    <text x="345" y="167" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Copy Prompt</text>

