    <text x="469" y="167" text-anchor="middle" fill="#fda4af" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Revoke</text>

    <text x="38" y="214" fill="#cbd5e1" font-family="ui-monospace, Consolas, monospace" font-size="11">Prompt: [Browser Bridge #42 RW edge] Fix race... (github.com)</text>

    <text x="24" y="264" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="0.6">SHARED TAB INVENTORY (2)</text>

