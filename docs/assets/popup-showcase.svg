    <text x="64" y="320" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">metrics.example.com · Shared by you</text>
    <rect x="402" y="294" width="110" height="24" rx="6" fill="#064e3b"/>
    <text x="457" y="310" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" font-weight="700">READ-ONLY</text>

    <rect x="20" y="344" width="508" height="56" rx="10" fill="#1a202c" stroke="#334155"/>
    <circle cx="42" cy="372" r="12" fill="#312e81"/>
    <text x="42" y="377" text-anchor="middle" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="12" font-weight="700">D</text>
    <text x="64" y="368" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600">System Architecture.drawio — diagrams.net</text>
    <text x="64" y="386" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">app.diagrams.net · In use by copilot-mcp</text>
    <rect x="402" y="360" width="110" height="24" rx="6" fill="#1e3a8a"/>
    <text x="457" y="376" text-anchor="middle" fill="#bfdbfe" font-family="system-ui, sans-serif" font-size="11" font-weight="700">ACTIVE LEASE</text>
  </g>

  <g transform="translate(644, 66)">
    <rect width="548" height="422" rx="16" fill="#141821" stroke="#334155" stroke-width="1.5"/>
    <text x="26" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Profile &amp; Permission Settings</text>
    <text x="522" y="35" text-anchor="end" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600">Per-Browser Profile</text>

    <rect x="20" y="56" width="508" height="56" rx="10" fill="#1a202c" stroke="#334155"/>
    <text x="36" y="79" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Global Read-Only Lock</text>
    <text x="36" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Blocks all clicks, typing, navigation, and tab mutations</text>
    <rect x="466" y="72" width="44" height="24" rx="12" fill="#334155"/>
    <circle cx="478" cy="84" r="9" fill="#cbd5e1"/>

    <rect x="20" y="122" width="508" height="56" rx="10" fill="#1a202c" stroke="#334155"/>
    <text x="36" y="145" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Trusted Mouse &amp; Keyboard Input (Chromium)</text>
    <text x="36" y="164" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Uses chrome.debugger for real user activation gestures</text>
    <rect x="466" y="138" width="44" height="24" rx="12" fill="#2563eb"/>
    <circle cx="498" cy="150" r="9" fill="#ffffff"/>

    <rect x="20" y="188" width="508" height="56" rx="10" fill="#1a202c" stroke="#334155"/>
    <text x="36" y="211" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Group Agent-Opened Tabs in Background</text>
    <text x="36" y="230" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Places agent tabs in a collapsed [Agent] group without focus steal</text>
    <rect x="466" y="204" width="44" height="24" rx="12" fill="#2563eb"/>
    <circle cx="498" cy="216" r="9" fill="#ffffff"/>

    <rect x="20" y="254" width="508" height="56" rx="10" fill="#1a202c" stroke="#334155"/>
    <text x="36" y="277" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Let Agents Use Any Tab</text>
    <text x="36" y="296" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Off by default — agents see only shared or agent-opened tabs</text>
    <rect x="466" y="270" width="44" height="24" rx="12" fill="#334155"/>
    <circle cx="478" cy="282" r="9" fill="#cbd5e1"/>

    <rect x="20" y="320" width="508" height="50" rx="10" fill="#1a202c" stroke="#334155"/>
    <text x="36" y="341" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Allow Arbitrary Page Scripts (browser_evaluate)</text>
    <text x="36" y="359" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">Dual-gated: off by default + requires mcp --allow-evaluate</text>
    <rect x="466" y="333" width="44" height="24" rx="12" fill="#334155"/>
    <circle cx="478" cy="345" r="9" fill="#cbd5e1"/>

    <text x="24" y="400" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Profile Label:</text>
    <rect x="122" y="381" width="180" height="30" rx="7" fill="#0f172a" stroke="#475569"/>
    <text x="136" y="401" fill="#f8fafc" font-family="ui-monospace, Consolas, monospace" font-size="13">Work</text>
    <text x="316" y="400" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Select via browser="Work"</text>
