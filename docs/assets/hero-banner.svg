<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Browser Bridge — Local MCP Server, Browser Extension, and Python SDK for Your Signed-In Tabs</title>
  <desc id="hero-desc">Hero banner illustrating Browser Bridge connecting local AI agents and Python scripts to Microsoft Edge, Google Chrome, Chromium, and Mozilla Firefox over zero-port local IPC.</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="20" fill="url(#bg-grad)"/>
  <rect width="1200" height="360" rx="20" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="358" rx="19" fill="none" stroke="#334155" stroke-width="1.5"/>

  <circle cx="1030" cy="90" r="170" fill="#2563eb" fill-opacity="0.16"/>
  <circle cx="150" cy="300" r="140" fill="#0ea5e9" fill-opacity="0.12"/>

  <g transform="translate(64, 62)">
    <rect width="76" height="76" rx="18" fill="url(#accent-grad)"/>
    <rect x="12" y="16" width="52" height="44" rx="8" fill="#0f172a"/>
    <circle cx="21" cy="24" r="2.6" fill="#38bdf8"/>
    <circle cx="29" cy="24" r="2.6" fill="#818cf8"/>
    <circle cx="37" cy="24" r="2.6" fill="#34d399"/>
    <path d="M 22 43 L 33 43 M 43 43 L 54 43" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
    <circle cx="38" cy="43" r="5" fill="none" stroke="#38bdf8" stroke-width="3"/>
  </g>

  <text x="160" y="100" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="44" font-weight="800" letter-spacing="-0.8">Browser Bridge</text>
  <rect x="498" y="72" width="76" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="536" y="92" text-anchor="middle" fill="#7dd3fc" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="14" font-weight="700">v0.7.0</text>

  <text x="160" y="134" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="500">Let local AI agents and Python scripts act safely inside your own signed-in Edge, Chrome, or Firefox tabs.</text>
  <text x="64" y="182" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16">Keep your real SSO, cookies, extensions, and sessions in your browser — with zero TCP ports, explicit tab grants, and adaptive site memory.</text>

  <g transform="translate(64, 214)" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">
    <g transform="translate(0, 0)">
      <rect width="248" height="40" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
      <circle cx="20" cy="20" r="5" fill="#34d399"/>
      <text x="34" y="25" fill="#f1f5f9">Edge · Chrome · Brave · Firefox</text>
    </g>
    <g transform="translate(264, 0)">
      <rect width="268" height="40" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1.2"/>
      <text x="18" y="25" fill="#7dd3fc">Rust Host (~1.5 MB · 0 TCP Ports)</text>
    </g>
    <g transform="translate(548, 0)">
      <rect width="276" height="40" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1.2"/>
      <text x="18" y="25" fill="#c7d2fe">26 MCP Tools + WebMCP + Prompts</text>
    </g>
    <g transform="translate(840, 0)">
      <rect width="296" height="40" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1.2"/>
      <text x="18" y="25" fill="#fde68a">Python SDK (~1.1 ms Direct Pipe IPC)</text>
    </g>
  </g>

  <g transform="translate(64, 270)" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600">
    <g transform="translate(0, 0)">
      <rect width="330" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="16" y="24" fill="#e2e8f0">3-Layer Read-Only / Read-Write Tab ACLs</text>
    </g>
    <g transform="translate(346, 0)">
      <rect width="368" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="16" y="24" fill="#e2e8f0">Adaptive Site Learner &amp; Multi-Step Routines</text>
    </g>
    <g transform="translate(730, 0)">
      <rect width="406" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="16" y="24" fill="#e2e8f0">Copilot · Claude · Cursor · Windsurf · Any RPC Client</text>
    </g>
  </g>
</svg>
