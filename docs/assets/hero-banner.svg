<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 400" width="1240" height="400" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Browser Bridge — Local, Secure, Fast, Self-Evolving Browser Automation for AI Agents</title>
  <desc id="hero-desc">Hero banner showcasing Browser Bridge's four core pillars: 100% Local execution in your signed-in tabs, Zero-Port OS-isolated Security, Native Rust ~1.1 ms Fast IPC, and Self-Evolving SiteLearner playbooks and routines.</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1240" height="400" rx="20" fill="url(#bg-grad)"/>
  <rect width="1240" height="400" rx="20" fill="url(#grid)"/>
  <rect x="1" y="1" width="1238" height="398" rx="19" fill="none" stroke="#334155" stroke-width="1.5"/>

  <circle cx="1060" cy="88" r="170" fill="#2563eb" fill-opacity="0.15"/>
  <circle cx="150" cy="330" r="140" fill="#0ea5e9" fill-opacity="0.11"/>

  <g transform="translate(48, 42)">
    <rect width="74" height="74" rx="18" fill="url(#accent-grad)"/>
    <rect x="12" y="15" width="50" height="44" rx="8" fill="#0f172a"/>
    <circle cx="21" cy="23" r="2.5" fill="#38bdf8"/>
    <circle cx="29" cy="23" r="2.5" fill="#818cf8"/>
    <circle cx="37" cy="23" r="2.5" fill="#34d399"/>
    <path d="M 21 42 L 32 42 M 42 42 L 53 42" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
    <circle cx="37" cy="42" r="5" fill="none" stroke="#38bdf8" stroke-width="3"/>
  </g>

  <text x="142" y="82" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="42" font-weight="800" letter-spacing="-0.6">Browser Bridge</text>
  <rect x="466" y="55" width="84" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="508" y="75" text-anchor="middle" fill="#7dd3fc" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="13.5" font-weight="700">v0.11.0</text>

  <rect x="764" y="53" width="428" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1.3"/>
  <text x="978" y="75" text-anchor="middle" fill="#bae6fd" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="800" letter-spacing="0.8">LOCAL · SECURE · FAST · SELF-EVOLVING</text>

  <text x="142" y="114" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="500">Let AI agents and Python scripts act safely inside your own signed-in Edge, Chrome, or Firefox tabs.</text>
  <text x="48" y="150" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5">Keep your real SSO, cookies, and extensions on your machine — zero cloud relay, zero TCP ports, ~1.1 ms IPC, and self-learning site memory.</text>

  <!-- Pillar 1: LOCAL -->
  <g transform="translate(48, 174)">
    <rect width="274" height="126" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.4"/>
    <circle cx="24" cy="28" r="5" fill="#38bdf8"/>
    <text x="38" y="33" fill="#7dd3fc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" font-weight="800">100% LOCAL</text>
    <text x="20" y="60" fill="#e2e8f0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5">Runs entirely on your device</text>
    <text x="20" y="82" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5">Reuses live SSO &amp; login tabs</text>
    <text x="20" y="104" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12">Zero cloud relay or WebDriver</text>
  </g>

  <!-- Pillar 2: SECURE -->
  <g transform="translate(338, 174)">
    <rect width="274" height="126" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.4"/>
    <circle cx="24" cy="28" r="5" fill="#10b981"/>
    <text x="38" y="33" fill="#6ee7b7" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" font-weight="800">ZERO-PORT SECURE</text>
    <text x="20" y="60" fill="#e2e8f0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5">0 open TCP / WebSocket ports</text>
    <text x="20" y="82" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5">SID Named Pipe &amp; 0600 socket</text>
    <text x="20" y="104" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12">3-layer Read/Write ACL &amp; masks</text>
  </g>

  <!-- Pillar 3: FAST -->
  <g transform="translate(628, 174)">
    <rect width="274" height="126" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="1.4"/>
    <circle cx="24" cy="28" r="5" fill="#f59e0b"/>
    <text x="38" y="33" fill="#fde68a" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" font-weight="800">NATIVE FAST</text>
    <text x="20" y="60" fill="#e2e8f0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5">~1.5 MB standalone Rust host</text>
    <text x="20" y="82" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5">~1.1 ms median Direct Pipe RTT</text>
    <text x="20" y="104" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12">1-RTT lazy DOM · 0-dep Python</text>
  </g>

  <!-- Pillar 4: SELF-EVOLVING -->
  <g transform="translate(918, 174)">
    <rect width="274" height="126" rx="14" fill="#0f172a" stroke="#818cf8" stroke-width="1.4"/>
    <circle cx="24" cy="28" r="5" fill="#818cf8"/>
    <text x="38" y="33" fill="#c7d2fe" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" font-weight="800">SELF-EVOLVING</text>
    <text x="20" y="60" fill="#e2e8f0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5">24 timestamped routines/*.json</text>
    <text x="20" y="82" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5">Up to 31x–1800x · [STALE] guard</text>
    <text x="20" y="104" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12">SiteLearner · Teach · WebMCP</text>
  </g>

  <!-- Bottom Ecosystem Strip -->
  <g transform="translate(48, 320)" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">
    <g transform="translate(0, 0)">
      <rect width="364" height="40" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="182" y="25" text-anchor="middle" fill="#f1f5f9">Edge · Chrome · Brave · Chromium · Firefox</text>
    </g>
    <g transform="translate(380, 0)">
      <rect width="372" height="40" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="186" y="25" text-anchor="middle" fill="#e2e8f0">31 MCP Tools · W3C WebMCP · 1-Prompt Setup</text>
    </g>
    <g transform="translate(768, 0)">
      <rect width="376" height="40" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="188" y="25" text-anchor="middle" fill="#e2e8f0">Copilot · Claude · Cursor · Windsurf · RPC</text>
    </g>
  </g>
</svg>
