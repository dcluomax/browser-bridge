[workspace]
resolver = "2"
members = [
    "crates/bridge-core",
    "crates/browser-bridge",
]

[workspace.package]
version = "0.10.1"
edition = "2024"
license = "MIT"
authors = ["dcluomax <1477354+dcluomax@users.noreply.github.com>"]
repository = "https://github.com/dcluomax/browser-bridge"
homepage = "https://github.com/dcluomax/browser-bridge"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
